name: Security example proposal
description: Propose a new vulnerability example, mitigation, or test
title: "[Example]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form for public, educational examples only.
        Do not include client-confidential code, private audit reports, secrets, or credentials.
  - type: textarea
    id: concept
    attributes:
      label: Security concept
      description: What vulnerability or security property would this example teach?
      placeholder: Describe the security concept and the vulnerable behavior.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and assumptions
      description: When is the issue relevant, and what assumptions does the example require?
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Proposed test
      description: How can the vulnerable behavior be reproduced, and how should the mitigation be tested?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Public references
      description: Add links to public documentation or write-ups, if available.
    validations:
      required: false
