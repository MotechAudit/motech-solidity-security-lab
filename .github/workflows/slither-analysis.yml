name: Slither Static Analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    name: Slither analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: stable

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install Slither
        run: |
          python -m pip install --upgrade pip
          python -m pip install slither-analyzer==0.11.6

      # Analyze production examples under src/ only. Exclude Foundry tests and scripts.
      - name: Compile Solidity source contracts only
        run: |
          forge clean
          forge build --build-info --skip test script --force

      - name: Run Slither against Foundry build info
        run: slither . --ignore-compile --sarif slither-results.sarif --fail-none --disable-color

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slither-static-analysis-report
          path: slither-results.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Explain report scope
        if: success()
        run: |
          {
            echo "### Slither static analysis"
            echo
            echo "The SARIF report is available as the `slither-static-analysis-report` workflow artifact."
            echo
            echo "The analyzer scans compiled production examples from `src/`. Foundry tests and scripts are excluded from the analysis build."
            echo
            echo "This repository intentionally contains vulnerable educational examples. Findings must be reviewed in that context and are not automatically treated as production vulnerabilities."
            echo
            echo "This workflow checks compilation and analyzer execution. It does not block on detected findings; reviewers should triage the report and correlate it with Foundry tests and manual review."
          } >> "$GITHUB_STEP_SUMMARY"
